# Retalho model assumptions.
#
# Every parameter has: value, unit, source_type (sponsor | public | assumption), note.
# All values below are PLACEHOLDERS (source_type: assumption) until VITRUS or the
# mentor confirms them. When a value is confirmed, change it here, set source_type
# to `sponsor` or `public`, and say where it came from in `note`.
# `value: null` means "unknown"; the UI then shows a count instead of a figure.

container_capacity_kg:
  value: 300
  unit: kg
  source_type: assumption
  note: Usable textile capacity of one container. Placeholder; ask the mentor.

fill_rate_profiles:
  value:
    low:  {mean: 0.35, spread: 0.15}
    mid:  {mean: 0.60, spread: 0.20}
    high: {mean: 0.90, spread: 0.25}
  unit: share of container capacity per week
  source_type: assumption
  note: >-
    Each container's average weekly fill, drawn once per seed from a gamma
    distribution with this mean and standard deviation (spread). Three profiles
    because the real rate is unknown; replace with values derived from the
    sponsor's characterisation if provided.

fill_weekly_cv:
  value: 0.3
  unit: coefficient of variation
  source_type: assumption
  note: >-
    Week-to-week variation of a container's fill around its own average
    (gamma, mean 1). Scenario B's planner knows each container's average
    rate but not this week's random factor.

collection_network_new_points:
  value: 15
  unit: count
  source_type: assumption
  note: >-
    Scenarios A and B are simulated on the existing textile points plus this many
    sites proposed by the coverage optimisation (the Coverage tab at +N), each
    given container_capacity_kg. 0 = existing points only. A planning choice.

collection_days_per_week:
  value: 5
  unit: days/week
  source_type: assumption
  note: Working days available for collection. Each truck can do one route per working day.

threshold_T:
  value: 0.8
  unit: share of capacity
  source_type: assumption
  note: Scenario B empties a container if its projected fill would reach T before the next run.

service_min_per_stop:
  value: 5
  unit: min
  source_type: assumption
  note: Time to empty one container, including parking. Placeholder; ask the mentor.

trucks:
  value: 2
  unit: count
  source_type: assumption
  note: >-
    Vehicles available for textile collection. Placeholder; ask the mentor. Raised
    from 1 because one truck could not serve the planned synthetic network at
    high fill (the simulator refuses to leave stops unserved). Only truck-days
    actually used are costed, identically for A and B.

truck_capacity_kg:
  value: 2500
  unit: kg
  source_type: assumption
  note: Payload per truck. Placeholder; ask the mentor.

truck_speed_factor:
  value: 0.8
  unit: ratio
  source_type: assumption
  note: >-
    Collection-truck speed as a share of OSRM free-flow car speed (travel times
    are divided by this). Placeholder; check against VITRUS route times.

shift_h:
  value: 8
  unit: h
  source_type: assumption
  note: Working time per truck per collection day. Placeholder; ask the mentor.

cost_per_km:
  value: 0.60
  unit: EUR/km
  source_type: assumption
  note: Fuel, maintenance and wear per km. Placeholder; ask the mentor.

crew_cost_per_h:
  value: 30
  unit: EUR/h
  source_type: assumption
  note: Combined hourly cost of the whole crew on one truck. Placeholder; ask the mentor.

fixed_cost_per_truck_day:
  value: 50
  unit: EUR/truck-day
  source_type: assumption
  note: Fixed cost each day a truck goes out. Placeholder; ask the mentor.

new_point_cost:
  value: null
  unit: EUR/point
  source_type: assumption
  note: Unknown. Investment is shown as a number of new points until VITRUS gives a unit cost.

coverage_radius_m:
  value: 500
  unit: m
  source_type: assumption
  note: Policy choice. A resident counts as covered within this distance of a textile point.

detour_factor:
  value: 1.42
  unit: ratio
  source_type: public
  note: >-
    Used only by the fallback (approximate) distance matrix, which is always
    labelled `approx`. Calibrated in M13 as the median OSRM road / straight-line
    ratio (IQR 1.33-1.57) over 12,530 pairs >= 300 m apart between the real
    public points (OSM recycling sites in Guimarães and the assumed depot), on
    OSM data of 2026-10-18 (Geofabrik Portugal). Recalibrate with `make matrix`
    when VITRUS's container list arrives.

fallback_speed_kmh:
  value: 45
  unit: km/h
  source_type: public
  note: >-
    Average driving speed used only by the fallback (approximate) matrix.
    Calibrated in M13 as the median OSRM free-flow car speed (45.1 km/h) over the
    same pairs. Free-flow car speed; a loaded collection truck in town is slower.

seeds:
  value: 10
  unit: count
  source_type: assumption
  note: Random seeds per scenario; results are reported as min / median / max across seeds.

horizon_weeks:
  value: 4
  unit: weeks
  source_type: assumption
  note: Simulation horizon set by the challenge (four-week comparison).
